name: induction_program_past_papers
description: "KP Teacher Induction Program Past Papers, Solved Answers & Practice"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.4

  # Local storage / offline cache
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.3

  # Original paper viewer
  pdfx: ^2.9.2
  photo_view: ^0.15.0

  # Utilities
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1

  # Admin: original paper file upload
  file_picker: ^8.1.6

  # Generated PDF export (answer key / short / long / complete solved paper)
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.2.2 # used by scripts/import_content.dart only (admin/CI tooling)

flutter:
  uses-material-design: true
